autoInstallPeers: false

dedupePeerDependents: true

engineStrict: true

saveExact: true

strictPeerDependencies: true

peerDependencyRules:
  ignoreMissing:
    - search-insights

overrides:
  fast-uri: ">=3.1.2"
  protobufjs: ">=7.6.1"
  # undici <8.5.0 advisories (GHSA-vmh5-mc38-953g TLS cert-validation bypass,
  # GHSA-38rv-x7px-6hhq / GHSA-vxpw-j846-p89q WebSocket DoS). Pulled in only via
  # testcontainers (declares `undici: ^8.3.0`); the fix is 8.5.0, which still
  # satisfies that range. Scoped to the testcontainers path so the unrelated
  # undici 7.x line resolved elsewhere is left untouched.
  testcontainers>undici: ">=8.5.0"
  # brace-expansion <2.1.2 / <5.0.7 advisory (GHSA-3jxr-9vmj-r5cp): DoS via
  # exponential-time expansion of consecutive non-expanding {} groups.
  # Two separate version lines are pulled in transitively — 2.x via
  # testcontainers>archiver>minimatch and 5.x via typedoc>minimatch@10.
  # Patch each major version in-place to avoid forcing cross-major upgrades.
  "brace-expansion@2": "2.1.2"
  "brace-expansion@5": "5.0.7"
  # js-yaml <3.15.0 / <4.3.0 advisory (GHSA-52cp-r559-cp3m): YAML merge-key
  # chains can force quadratic CPU consumption. Two version lines are present:
  #   • 3.x via @changesets/cli>@manypkg/get-packages>read-yaml-file
  #   • 4.x via @changesets/cli>@changesets/parse
  # Scoped to the immediate parent in each chain to avoid cross-major collisions.
  read-yaml-file>js-yaml: "^3.15.0"
  "@changesets/parse>js-yaml": ">=4.3.0"

packages:
  - packages/*
  - examples/*
  - tools/*
  - docs

catalog:
  "@btravstack/theme": 1.6.1
  "@changesets/cli": 2.31.0
  "@commitlint/cli": 21.2.0
  "@commitlint/config-conventional": 21.2.0
  "@standard-schema/spec": 1.1.0
  "@temporalio/client": 1.20.2
  "@temporalio/testing": 1.20.2
  "@temporalio/common": 1.20.2
  "@temporalio/worker": 1.20.2
  "@temporalio/workflow": 1.20.2
  "@types/node": 24.13.2
  "@unthrown/vitest": 4.1.0
  "@vitest/coverage-v8": 4.1.8
  arktype: 2.2.2
  knip: 6.24.0
  lefthook: 2.1.9
  oxfmt: 0.58.0
  oxlint: 1.73.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  testcontainers: 12.0.4
  tsdown: 0.22.3
  tsx: 4.23.0
  turbo: 2.10.4
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.12.0
  typescript: 6.0.3
  unthrown: 4.1.0
  valibot: 1.4.2
  vitest: 4.1.8
  zod: 4.4.3

allowBuilds:
  "@swc/core": true
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# First-party btravstack packages — the maturity delay guards against
# third-party supply-chain risk, which does not apply to our own org's libraries.
minimumReleaseAgeExclude:
  - "@btravstack/theme"
  - "unthrown"
  - "@unthrown/vitest"
auditConfig: { ignoreGhsas: null }
