autoInstallPeers: false
dedupePeerDependents: true
engineStrict: true
saveExact: true
strictPeerDependencies: true

packages:
  - packages/*
  - examples/*
  - docs

catalog:
  "@btravstack/commitlint": 0.1.0
  "@btravstack/lefthook": 0.1.1
  "@btravstack/oxlint": 0.2.1
  "@btravstack/theme": 1.7.0
  "@btravstack/tsconfig": 0.2.0
  "@btravstack/typedoc": 0.1.0
  "@changesets/cli": 2.31.0
  "@commitlint/cli": 21.2.1
  "@standard-schema/spec": 1.1.0
  "@temporalio/client": 1.20.3
  "@temporalio/common": 1.20.3
  "@temporalio/testing": 1.20.3
  "@temporalio/worker": 1.20.3
  "@temporalio/workflow": 1.20.3
  "@types/node": 26.1.1
  "@unthrown/vitest": 5.0.0-beta.5
  "@vitest/coverage-v8": 4.1.10
  arktype: 2.2.3
  knip: 6.27.0
  lefthook: 2.1.10
  oxfmt: 0.58.0
  oxlint: 1.73.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  testcontainers: 12.0.4
  ts-pattern: 5.9.0
  tsdown: 0.22.7
  tsx: 4.23.1
  turbo: 2.10.5
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.12.0
  typescript: 6.0.3
  unthrown: 5.0.0-beta.5
  valibot: 1.4.2
  vitest: 4.1.10
  zod: 4.4.3

peerDependencyRules:
  ignoreMissing:
    - search-insights

# Force patched versions of vulnerable transitive dependencies. Each override
# pulls a transitive dep to its first fixed release without disturbing unrelated
# version lines. High-severity advisories gate CI's `pnpm audit --audit-level=high`.
overrides:
  # GHSA-v2hh-gcrm-f6hx (High): fast-uri host confusion via literal backslash
  # authority delimiter. Only the vulnerable <3.1.4 line is present (transitive,
  # dev/build tooling); 3.1.4 is the first patched release. Newly disclosed.
  # fast-uri is added to minimumReleaseAgeExclude below because 3.1.4 is younger
  # than the 7-day cutoff.
  "fast-uri@<3.1.4": "3.1.4"
  # GHSA-3jxr-9vmj-r5cp (ReDoS) + GHSA-mh99-v99m-4gvg (DoS via unbounded
  # expansion length): brace-expansion. Two lines are present — 2.x via
  # testcontainers>archiver>minimatch and 5.x via typedoc>minimatch@10. The 5.x
  # line is pulled to 5.0.8 (the only release patched for GHSA-mh99); the 2.x
  # line stays on its ReDoS-patched release — GHSA-mh99 has NO patched release
  # for it (vulnerable range <=5.0.7), so that advisory is ignored via
  # auditConfig.ignoreGhsas below rather than force-upgrading across majors.
  "brace-expansion@2": "2.1.2"
  "brace-expansion@5": "5.0.8"
  # GHSA-52cp-r559-cp3m: js-yaml quadratic-CPU merge keys. Two lines present —
  # 3.x via @changesets/cli>@manypkg/get-packages>read-yaml-file and 4.x via
  # @changesets/cli>@changesets/parse. Each major line is version-scoped and
  # pinned to its patched release.
  "js-yaml@3": "3.15.0"
  "js-yaml@4": "4.3.0"
  # GHSA-fx2h-pf6j-xcff: vite `server.fs.deny` bypass (dev-server only; the docs
  # ship as static HTML). Reaches us via docs > vitepress > vite. vitepress 1.6.x
  # pins vite 5.x and 5.x has no patched release, so lift any pre-6.4.3 vite to
  # 6.4.3 (the first fixed version) — the docs `vitepress build` is verified
  # against it. This also drags esbuild to a patched 0.25.x, resolving GHSA-gv7w-rqvm-qjhr.
  "vite@<6.4.3": "6.4.3"

allowBuilds:
  "@swc/core": true
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true

# Supply-chain maturity delay: don't adopt a freshly published version until it
# has been on the registry for 7 days (10080 minutes). Strict mode also validates
# the committed lockfile against this cutoff.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# First-party btravstack packages — the maturity delay guards against
# third-party supply-chain risk, which does not apply to our own org's libraries.
minimumReleaseAgeExclude:
  - "@btravstack/commitlint"
  - "@btravstack/lefthook"
  - "@btravstack/oxlint"
  - "@btravstack/theme"
  - "@btravstack/tsconfig"
  - "@btravstack/typedoc"
  - "unthrown"
  - "@unthrown/vitest"
  # Temporary: fast-uri 3.1.4 (the GHSA-v2hh-gcrm-f6hx override above) is younger
  # than the 7-day cutoff. Remove once 3.1.4 is 7 days old (published 2026-07-19).
  - fast-uri
  # Temporary: brace-expansion 5.0.8 (the GHSA-mh99-v99m-4gvg override above) is
  # younger than the 7-day cutoff. Remove once 5.0.8 is 7 days old (published
  # 2026-07-23).
  - brace-expansion

# GHSA-mh99-v99m-4gvg (brace-expansion DoS via unbounded expansion length) has a
# patched release ONLY on the 5.x line (>=5.0.8, applied via the override above);
# the 2.x line resolved under testcontainers > archiver has no patched release,
# and forcing it to 5.x across majors is unsafe. Accepted risk: the expansion
# input there is library-internal glob patterns, never user input. Remove this
# ignore as soon as upstream ships a patched 2.x (or archiver moves to
# minimatch@10).
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
