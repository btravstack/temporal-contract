autoInstallPeers: false
dedupePeerDependents: true
engineStrict: true
saveExact: true
strictPeerDependencies: true

packages:
  - packages/*
  - examples/*
  - docs

catalog:
  "@arethetypeswrong/cli": 0.18.5
  "@btravstack/commitlint": 0.1.0
  "@btravstack/lefthook": 0.1.1
  "@btravstack/oxlint": 0.2.1
  "@unthrown/oxlint": 5.10.0
  "@unthrown/saga": 5.10.0
  "@btravstack/theme": 2.0.0
  "@btravstack/tsconfig": 0.4.0
  "@btravstack/typedoc": 0.1.0
  "@changesets/cli": 3.0.3
  "@commitlint/cli": 21.2.3
  "@standard-schema/spec": 1.1.0
  "@stryker-mutator/core": 10.0.0
  "@stryker-mutator/vitest-runner": 10.0.0
  "@temporalio/activity": 1.24.0
  "@temporalio/client": 1.24.0
  "@temporalio/common": 1.24.0
  "@temporalio/testing": 1.24.0
  "@temporalio/worker": 1.24.0
  "@temporalio/workflow": 1.24.0
  "@types/node": 26.6.2
  "@unthrown/vitest": 5.10.0
  "@vitest/coverage-v8": 5.0.1
  arktype: 2.2.3
  knip: 6.37.0
  lefthook: 2.1.14
  mermaid: 12.0.0
  oxfmt: 0.70.0
  oxlint: 1.85.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  publint: 0.3.24
  testcontainers: 12.1.0
  tsdown: 0.23.0
  tsx: 4.23.15
  turbo: 2.11.3
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.13.1
  typescript: 7.0.2
  unthrown: 5.10.0
  valibot: 1.5.0
  vitepress: 1.6.4
  vitepress-plugin-mermaid: 2.0.17
  vitest: 5.0.1
  zod: 4.6.5

peerDependencyRules:
  ignoreMissing:
    - search-insights
  # Peer ranges that lag a major we run on. Each is verified by the suite that
  # exercises it; drop the entry once upstream widens its range.
  allowedVersions:
    # @unthrown/vitest 5.10.0 still declares `vitest ^4`; its matchers run
    # under every package's unit and integration tests on vitest 5.
    "@unthrown/vitest>vitest": "5"
    # vitepress-plugin-mermaid (last release 2024) declares `mermaid 10 || 11`;
    # a flowchart renders with mermaid 12 in both `vitepress dev` (given the
    # `optimizeDeps` entry in docs/.vitepress/config.ts) and the built site.
    "vitepress-plugin-mermaid>mermaid": "12"

# Force patched versions of vulnerable transitive dependencies. Each override
# pulls a transitive dep to its first fixed release without disturbing unrelated
# version lines. High-severity advisories gate CI's `pnpm audit --audit-level=high`.
overrides:
  # GHSA-v2hh-gcrm-f6hx, GHSA-5jgf-p345-68v8 and GHSA-8gv4-fj48-4jhw (High):
  # fast-uri host confusion via a literal backslash authority delimiter, then
  # via skipped IDN canonicalization, then SSRF via malformed IPv6
  # normalization. Each disclosure widened the range; <3.1.6 is the current
  # one, so the transitive dev/build line moves with it. Raise THIS floor
  # rather than adding a second overlapping range — with two entries pnpm
  # resolves the older, still-vulnerable pin.
  #
  # Raised to 3.1.7 for GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g (High),
  # the latter naming 3.1.6 itself.
  "fast-uri@<3.1.7": "3.1.7"
  # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-7p8r-x3mc-p8w7, and
  # GHSA-rgw5-rvv9-x895 (all ReDoS / expansion-DoS): brace-expansion. Two lines
  # are present — 2.x via testcontainers>archiver>minimatch and 5.x via
  # typedoc>minimatch@10. Both majors now have patched releases, so pin each line
  # to its first fixed version without crossing majors.
  #
  # Raised to 2.1.6 / 5.0.11 for GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7
  # (High), both disclosed against the previous 2.1.4 / 5.0.9 pins.
  "brace-expansion@2": "2.1.6"
  "brace-expansion@5": "5.0.11"
  # GHSA-4cwx-7wf7-3272 (High): undici cross-user information disclosure and
  # parse-time crash via degenerate private-cache directives. Reaches us only via
  # packages/testing > testcontainers, which currently resolves undici 8.x.
  # Pin that major line to its first patched release.
  #
  # Raised to 8.10.2 for GHSA-rfgv-xxqx-mfg5 and GHSA-w293-vg96-wgc3 (High).
  "undici@8": "8.10.2"
  # GHSA-52cp-r559-cp3m: js-yaml quadratic-CPU merge keys. Two lines present —
  # 3.x via @changesets/cli>@manypkg/get-packages>read-yaml-file and 4.x via
  # @changesets/cli>@changesets/parse. Each major line is version-scoped and
  # pinned to its patched release.
  #
  # Raised to 3.15.1 / 4.3.1 for GHSA-5p4m-2wfm-xmqj (High), a later advisory on
  # the same package that 3.15.0 / 4.3.0 predate.
  #
  # 4.x raised to 4.3.2 for GHSA-2883-xcg3-v3hh (High): maxTotalMergeKeys does
  # not limit CPU use for empty merge sources. The 3.x line is not affected.
  "js-yaml@3": "3.15.1"
  "js-yaml@4": "4.3.2"
  # GHSA-2v37-7h3g-55p8 (High): nanoid custom generators can loop indefinitely
  # when size is zero. Reaches us only through the docs build —
  # docs > @btravstack/theme > vitepress > postcss > nanoid — never the shipped
  # package. The advisory later widened to <3.3.18, so the floor moves with it.
  "nanoid@<3.3.18": "3.3.18"
  # GHSA-fx2h-pf6j-xcff: vite `server.fs.deny` bypass (dev-server only; the docs
  # ship as static HTML). Reaches us via docs > vitepress > vite. vitepress 1.6.x
  # pins vite 5.x and 5.x has no patched release, so lift any pre-6.4.3 vite to
  # 6.4.3 (the first fixed version) — the docs `vitepress build` is verified
  # against it. This also drags esbuild to a patched 0.25.x, resolving GHSA-gv7w-rqvm-qjhr.
  "vite@<6.4.3": "6.4.3"
  # GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g (both High): browserslist
  # config parsing. Reaches us only through examples/order-processing-worker >
  # @temporalio/worker > webpack — the workflow bundler, a dev/build path that
  # no published package carries. Upstream has nothing to take: @temporalio/
  # worker's webpack dependency resolves the vulnerable line on its own, and
  # 4.28.7 is the first release patching both advisories.
  "browserslist@<4.28.7": "4.28.7"
  # GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74 (all High,
  # ReDoS): minimatch 10.x. Reaches us via @stryker-mutator/core, added for the
  # nightly mutation run. Only the 10.x line is present, and 10.2.3 is the first
  # release patching all three, so the override is version-scoped to that line
  # rather than applied across majors.
  "minimatch@10": "10.2.3"
  # GHSA-2g4f-4pwh-qvx6 (Moderate, ReDoS via the `$data` option): ajv 8.x, also
  # via @stryker-mutator/core. We never pass `$data` schemas — Stryker uses ajv
  # to validate its own config — but 8.18.0 is a patch-level lift within the
  # major already in use, so there is no reason not to take it.
  "ajv@8": "8.18.0"
  # GHSA-4x5r-pxfx-6jf8 (Low, arbitrary file read via a sourceMappingURL
  # comment): @babel/core, via @stryker-mutator/core's instrumenter. Build-time
  # tooling only, reading sources we already trust. The advisory names 7.29.1 as
  # the first patched version, but that was never published — the 7.29.x line
  # goes 7.29.0 -> 7.29.6 -> 7.29.7 — so pin the head of the 7.x line, staying
  # within the major already in use.
  "@babel/core@<7.29.7": "7.29.7"
  # GHSA-c2j3-45gr-mqc4 (Low): DOMPurify `CUSTOM_ELEMENT_HANDLING` bypasses
  # `afterSanitizeAttributes`. Reaches us via docs > mermaid > dompurify, and is
  # unrelated to this branch — the advisory was disclosed after main's last
  # green audit, so main is affected too. GHSA-55q2-fjhq-7xh7 (moderate) then
  # moved the patched floor to 3.4.13, so the override moves with it.
  "dompurify@<3.4.13": "3.4.13"
  # GHSA-r5fr-rjxr-66jc (High): lodash-es <=4.17.23. Reaches us only through
  # the docs build — docs > mermaid 12 > chevrotain > lodash-es, which pins
  # 4.17.23 exactly — never a shipped package. 4.18.1 is the first patched
  # release and is already what mermaid's other lodash-es consumer resolves.
  "lodash-es@<4.18.1": "4.18.1"

allowBuilds:
  "@swc/core": true
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true

# Supply-chain maturity delay: don't adopt a freshly published version until it
# has been on the registry for 7 days (10080 minutes). Strict mode also validates
# the committed lockfile against this cutoff.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# First-party btravstack packages — the maturity delay guards against
# third-party supply-chain risk, which does not apply to our own org's libraries.
minimumReleaseAgeExclude:
  - "@btravstack/commitlint"
  - "@btravstack/lefthook"
  - "@btravstack/oxlint"
  - "@btravstack/theme"
  - "@btravstack/tsconfig"
  - "@btravstack/typedoc"
  - "unthrown"
  - "@unthrown/oxlint"
  - "@unthrown/saga"
  - "@unthrown/vitest"
