# Force patched versions of vulnerable transitive dependencies. Each override
# pulls a transitive dep to its first fixed release without disturbing unrelated
# version lines. High-severity advisories gate CI's `pnpm audit --audit-level=high`.
overrides:
  # GHSA-v2hh-gcrm-f6hx (High): fast-uri host confusion via literal backslash
  # authority delimiter. The advisory widened after disclosure; the vulnerable
  # range is now <3.1.5, so pin the transitive dev/build line to 3.1.5.
  "fast-uri@<3.1.5": "3.1.5"
  # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-7p8r-x3mc-p8w7, and
  # GHSA-rgw5-rvv9-x895 (all ReDoS / expansion-DoS): brace-expansion. Two lines
  # are present — 2.x via testcontainers>archiver>minimatch and 5.x via
  # typedoc>minimatch@10. Both majors now have patched releases, so pin each line
  # to its first fixed version without crossing majors.
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  # GHSA-4cwx-7wf7-3272 (High): undici cross-user information disclosure and
  # parse-time crash via degenerate private-cache directives. Reaches us only via
  # packages/testing > testcontainers, which currently resolves undici 8.x.
  # Pin that major line to its first patched release.
  "undici@8": "8.9.0"
  # GHSA-52cp-r559-cp3m: js-yaml quadratic-CPU merge keys. Two lines present —
  # 3.x via @changesets/cli>@manypkg/get-packages>read-yaml-file and 4.x via
  # @changesets/cli>@changesets/parse. Each major line is version-scoped and
  # pinned to its patched release.
  #
  # Raised to 3.15.1 / 4.3.1 for GHSA-5p4m-2wfm-xmqj (High), a later advisory on
  # the same package that 3.15.0 / 4.3.0 predate.
  "js-yaml@3": "3.15.1"
  "js-yaml@4": "4.3.1"
  # GHSA-2v37-7h3g-55p8 (High): nanoid custom generators can loop indefinitely
  # when size is zero. Reaches us only through the docs build —
  # docs > @btravstack/theme > vitepress > postcss > nanoid — never the shipped
  # package. The advisory later widened to <3.3.18, so the floor moves with it.
  "nanoid@<3.3.18": "3.3.18"
  # GHSA-fx2h-pf6j-xcff: vite `server.fs.deny` bypass (dev-server only; the docs
  # ship as static HTML). Reaches us via docs > vitepress > vite. vitepress 1.6.x
  # pins vite 5.x and 5.x has no patched release, so lift any pre-6.4.3 vite to
  # 6.4.3 (the first fixed version) — the docs `vitepress build` is verified
  # against it. This also drags esbuild to a patched 0.25.x, resolving GHSA-gv7w-rqvm-qjhr.
  "vite@<6.4.3": "6.4.3"
  # GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74 (all High,
  # ReDoS): minimatch 10.x. Reaches us via @stryker-mutator/core, added for the
  # nightly mutation run. Only the 10.x line is present, and 10.2.3 is the first
  # release patching all three, so the override is version-scoped to that line
  # rather than applied across majors.
  "minimatch@10": "10.2.3"
  # GHSA-2g4f-4pwh-qvx6 (Moderate, ReDoS via the `$data` option): ajv 8.x, also
  # via @stryker-mutator/core. We never pass `$data` schemas — Stryker uses ajv
  # to validate its own config — but 8.18.0 is a patch-level lift within the
  # major already in use, so there is no reason not to take it.
  "ajv@8": "8.18.0"
  # GHSA-4x5r-pxfx-6jf8 (Low, arbitrary file read via a sourceMappingURL
  # comment): @babel/core, via @stryker-mutator/core's instrumenter. Build-time
  # tooling only, reading sources we already trust. The advisory names 7.29.1 as
  # the first patched version, but that was never published — the 7.29.x line
  # goes 7.29.0 -> 7.29.6 -> 7.29.7 — so pin the head of the 7.x line, staying
  # within the major already in use.
  "@babel/core@<7.29.7": "7.29.7"
  # GHSA-c2j3-45gr-mqc4 (Low): DOMPurify `CUSTOM_ELEMENT_HANDLING` bypasses
  # `afterSanitizeAttributes`. Reaches us via docs > mermaid > dompurify, and is
  # unrelated to this branch — the advisory was disclosed after main's last
  # green audit, so main is affected too. GHSA-55q2-fjhq-7xh7 (moderate) then
  # moved the patched floor to 3.4.13, so the override moves with it.
  "dompurify@<3.4.13": "3.4.13"

allowBuilds:
  "@swc/core": true
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true

# Supply-chain maturity delay: don't adopt a freshly published version until it
# has been on the registry for 7 days (10080 minutes). Strict mode also validates
# the committed lockfile against this cutoff.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# First-party btravstack packages — the maturity delay guards against
# third-party supply-chain risk, which does not apply to our own org's libraries.
minimumReleaseAgeExclude:
  - "@btravstack/commitlint"
  - "@btravstack/lefthook"
  - "@btravstack/oxlint"
  - "@btravstack/theme"
  - "@btravstack/tsconfig"
  - "@btravstack/typedoc"
  - "unthrown"
  - "@unthrown/oxlint"
  - "@unthrown/vitest"
  # Temporary: nanoid 3.3.18 (the widened GHSA-2v37-7h3g-55p8 override above)
  # was published 2026-08-07, inside the 7-day cutoff. Remove once it is 7 days
  # old (i.e. after 2026-08-14). dompurify 3.4.13 needs no entry — published
  # 2026-08-03, past the cutoff.
  - nanoid
