version: 2
updates:
  # pnpm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      temporal:
        patterns:
          - "@temporalio/*"
      commitlint:
        patterns:
          - "@commitlint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      unthrown:
        patterns:
          - "unthrown"
          - "@unthrown/*"
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # @types/node tracks the supported Node floor's major (22.x, see engines), so
      # types never advertise APIs the oldest supported runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Mirror pnpm's minimumReleaseAge: wait before proposing freshly published versions.
    # Dependabot does not read pnpm-workspace.yaml, so this must be configured here.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    # The composite action under .github/actions is not scanned from "/".
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
