name: "Setup Node.js and pnpm"
description: "Setup Node.js and pnpm, install dependencies, and setup turbo cache"

inputs:
  node-version:
    description: "Node.js version override; when empty, .node-version is used"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # setup-node ignores an empty node-version and falls back to the file
        node-version: ${{ inputs.node-version }}
        node-version-file: ".node-version"
        cache: "pnpm"

    - name: Setup turbo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
