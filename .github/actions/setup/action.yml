name: "Setup Node.js and pnpm"
description: "Setup Node.js and pnpm, install dependencies, and setup turbo cache"

inputs:
  node-version:
    description: "Node.js version override; when empty, .node-version is used"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # setup-node ignores an empty node-version and falls back to the file
        node-version: ${{ inputs.node-version }}
        node-version-file: ".node-version"
        cache: "pnpm"

    - name: Setup turbo cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
